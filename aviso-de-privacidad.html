document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"6ef93390-3280-4ba0-b8eb-cb97625daf02\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   CISEC — Sistema visual base\n   Centro Integral de Saberes, Evaluación y Certificación\n   ============================================================ */\n\n:root {\n  /* Paleta */\n  --navy: #0B1A3A;\n  --navy-deep: #07122A;\n  --gold: #C19A4C;\n  --gold-soft: #D4B679;\n  --cream: #F5F1E8;\n  --cream-line: #E6DFCE;\n  --ink: #1C2028;\n  --ink-soft: #4A4F5A;\n  --grey-soft: #B4AFA5;\n  --white: #FFFFFF;\n\n  /* Tipografía */\n  --serif: \"Cormorant Garamond\", \"EB Garamond\", Georgia, serif;\n  --sans: \"Inter Tight\", \"Inter\", -apple-system, system-ui, sans-serif;\n  --mono: \"JetBrains Mono\", \"IBM Plex Mono\", ui-monospace, monospace;\n\n  /* Escala tipográfica */\n  --fs-eyebrow: 12px;\n  --fs-body: 17px;\n  --fs-lead: 20px;\n  --fs-h3: clamp(24px, 2.2vw, 32px);\n  --fs-h2: clamp(36px, 4vw, 56px);\n  --fs-h1: clamp(48px, 6vw, 88px);\n  --fs-roman: clamp(120px, 16vw, 220px);\n\n  /* Estructura */\n  --max-w: 1240px;\n  --max-w-text: 720px;\n  --gutter: clamp(20px, 4vw, 56px);\n  --section-y: clamp(72px, 9vw, 128px);\n\n  /* Otros */\n  --border: 1px solid var(--cream-line);\n  --shadow-card: 0 1px 2px rgba(11, 26, 58, 0.04), 0 8px 24px -12px rgba(11, 26, 58, 0.08);\n  --radius: 2px;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--cream);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: var(--fs-body);\n  line-height: 1.6;\n  font-feature-settings: \"ss01\", \"cv11\";\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nimg { max-width: 100%; display: block; }\n\na {\n  color: inherit;\n  text-decoration: none;\n}\n\n/* ============================================================\n   Tipografía editorial\n   ============================================================ */\n\n.eyebrow {\n  font-family: var(--mono);\n  font-size: var(--fs-eyebrow);\n  font-weight: 500;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--ink);\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n}\n.eyebrow--muted { color: var(--grey-soft); }\n.eyebrow--gold { color: var(--gold); }\n.eyebrow--on-navy { color: var(--gold); }\n\n/* Línea dorada corta antes del eyebrow */\n.rule {\n  display: inline-block;\n  width: 36px;\n  height: 1px;\n  background: var(--gold);\n  vertical-align: middle;\n  flex: 0 0 36px;\n}\n.rule--on-navy { background: var(--gold); }\n\nh1, h2, h3, h4 {\n  font-family: var(--serif);\n  font-weight: 500;\n  color: var(--navy);\n  margin: 0;\n  line-height: 1.04;\n  letter-spacing: -0.01em;\n  text-wrap: pretty;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); line-height: 1.15; }\n\n/* Itálica selectiva: la última parte del titular */\n.ital {\n  font-style: italic;\n  color: var(--navy-deep);\n  font-weight: 500;\n}\n\np { margin: 0 0 1em; max-width: var(--max-w-text); }\np.lead {\n  font-size: var(--fs-lead);\n  line-height: 1.55;\n  color: var(--ink);\n}\n\nsmall, .small { font-size: 13px; color: var(--ink-soft); }\n\n/* Romano decorativo */\n.roman {\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 400;\n  font-size: var(--fs-roman);\n  color: var(--gold);\n  opacity: 0.18;\n  line-height: 0.8;\n  letter-spacing: -0.03em;\n  pointer-events: none;\n  user-select: none;\n}\n\n/* Lista con punto dorado */\n.dot-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }\n.dot-list li {\n  position: relative;\n  padding-left: 22px;\n  line-height: 1.5;\n}\n.dot-list li::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: 0.7em;\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--gold);\n}\n\n/* ============================================================\n   Layout\n   ============================================================ */\n\n.wrap {\n  max-width: var(--max-w);\n  margin: 0 auto;\n  padding-left: var(--gutter);\n  padding-right: var(--gutter);\n}\n\n.section { padding-top: var(--section-y); padding-bottom: var(--section-y); position: relative; }\n.section--tight { padding-top: clamp(48px, 6vw, 72px); padding-bottom: clamp(48px, 6vw, 72px); }\n\n.band-navy {\n  background: var(--navy);\n  color: var(--cream);\n}\n.band-navy h1, .band-navy h2, .band-navy h3 { color: var(--cream); }\n.band-navy .ital { color: var(--gold-soft); }\n\n/* ============================================================\n   Tarjeta base\n   ============================================================ */\n\n.card {\n  background: var(--white);\n  border: 1px solid var(--cream-line);\n  border-radius: var(--radius);\n  padding: clamp(24px, 3vw, 40px);\n  box-shadow: var(--shadow-card);\n}\n\n/* ============================================================\n   Botones\n   ============================================================ */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--sans);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: 0.01em;\n  padding: 13px 22px;\n  border-radius: 2px;\n  border: 1px solid transparent;\n  cursor: pointer;\n  transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease;\n  text-decoration: none;\n}\n.btn--primary {\n  background: var(--navy);\n  color: var(--cream);\n  border-color: var(--navy);\n}\n.btn--primary:hover { background: var(--navy-deep); }\n.btn--ghost {\n  background: transparent;\n  color: var(--navy);\n  border-color: var(--navy);\n}\n.btn--ghost:hover { background: var(--navy); color: var(--cream); }\n.btn--gold {\n  background: var(--gold);\n  color: var(--navy);\n  border-color: var(--gold);\n}\n.btn--gold:hover { background: var(--gold-soft); }\n\n.btn .arr {\n  width: 14px; height: 14px;\n  display: inline-block;\n  transition: transform .2s ease;\n}\n.btn:hover .arr { transform: translateX(3px); }\n\n/* ============================================================\n   HEADER\n   ============================================================ */\n\n.site-header {\n  background: var(--cream);\n  border-bottom: 1px solid var(--cream-line);\n  position: sticky;\n  top: 0;\n  z-index: 50;\n}\n.site-header__inner {\n  max-width: var(--max-w);\n  margin: 0 auto;\n  padding: 18px var(--gutter);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 32px;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  text-decoration: none;\n}\n.brand__img {\n  height: 56px;\n  width: auto;\n  display: block;\n}\n@media (max-width: 540px) {\n  .brand__img { height: 48px; }\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n.nav__list {\n  display: flex;\n  gap: 4px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n.nav__link {\n  font-family: var(--sans);\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--ink);\n  padding: 10px 14px;\n  position: relative;\n  transition: color .15s ease;\n}\n.nav__link:hover { color: var(--navy); }\n.nav__link::after {\n  content: \"\";\n  position: absolute;\n  left: 14px;\n  right: 14px;\n  bottom: 4px;\n  height: 1.5px;\n  background: var(--gold);\n  transform: scaleX(0);\n  transform-origin: left center;\n  transition: transform .2s ease;\n}\n.nav__link.is-active::after { transform: scaleX(1); }\n.nav__cta { margin-left: 16px; }\n\n/* Mobile menu */\n.nav__toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--cream-line);\n  width: 40px; height: 40px;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  padding: 0;\n}\n.nav__toggle span,\n.nav__toggle span::before,\n.nav__toggle span::after {\n  display: block;\n  width: 18px;\n  height: 1.5px;\n  background: var(--navy);\n  position: relative;\n}\n.nav__toggle span::before,\n.nav__toggle span::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n}\n.nav__toggle span::before { top: -6px; }\n.nav__toggle span::after { top: 6px; }\n\n@media (max-width: 960px) {\n  .nav__list, .nav__cta { display: none; }\n  .nav__toggle { display: inline-flex; }\n  .nav.is-open .nav__list {\n    display: flex;\n    position: absolute;\n    top: 100%;\n    left: 0;\n    right: 0;\n    flex-direction: column;\n    background: var(--cream);\n    border-bottom: 1px solid var(--cream-line);\n    padding: 16px var(--gutter) 24px;\n    gap: 0;\n  }\n  .nav.is-open .nav__list .nav__link {\n    padding: 14px 0;\n    border-bottom: 1px solid var(--cream-line);\n  }\n  .nav.is-open .nav__cta {\n    display: inline-flex;\n    margin: 16px var(--gutter) 0;\n  }\n}\n\n/* ============================================================\n   FOOTER\n   ============================================================ */\n\n.site-footer {\n  background: var(--navy);\n  color: var(--cream);\n}\n.site-footer__inner {\n  max-width: var(--max-w);\n  margin: 0 auto;\n  padding: clamp(56px, 7vw, 96px) var(--gutter) clamp(40px, 5vw, 56px);\n  display: grid;\n  grid-template-columns: 1.2fr 1fr 1.3fr 1fr;\n  gap: clamp(32px, 4vw, 56px);\n}\n@media (max-width: 880px) {\n  .site-footer__inner { grid-template-columns: 1fr 1fr; }\n}\n@media (max-width: 520px) {\n  .site-footer__inner { grid-template-columns: 1fr; }\n}\n\n.foot-brand__img {\n  width: 160px;\n  height: auto;\n  display: block;\n}\n\n.foot-h {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--gold);\n  margin: 0 0 18px;\n  font-weight: 500;\n}\n\n.foot-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }\n.foot-list a, .foot-list span {\n  font-size: 14px;\n  color: var(--cream);\n  opacity: 0.85;\n  line-height: 1.55;\n  transition: opacity .15s ease, color .15s ease;\n}\n.foot-list a:hover { opacity: 1; color: var(--gold-soft); }\n\n.foot-contact-line {\n  font-size: 14px;\n  color: var(--cream);\n  opacity: 0.85;\n  line-height: 1.55;\n}\n.foot-contact-line + .foot-contact-line { margin-top: 10px; }\n\n.site-footer__bar {\n  border-top: 1px solid rgba(193, 154, 76, 0.18);\n}\n.site-footer__bar-inner {\n  max-width: var(--max-w);\n  margin: 0 auto;\n  padding: 20px var(--gutter);\n  font-family: var(--mono);\n  font-size: 10.5px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--cream);\n  opacity: 0.6;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px 14px;\n}\n\n/* ============================================================\n   Hero base (reutilizable por todas las páginas)\n   ============================================================ */\n\n.hero {\n  position: relative;\n  padding-top: clamp(64px, 8vw, 112px);\n  padding-bottom: clamp(56px, 7vw, 96px);\n  overflow: hidden;\n}\n.hero__inner { position: relative; z-index: 1; }\n.hero__roman {\n  position: absolute;\n  right: var(--gutter);\n  top: 50%;\n  transform: translateY(-50%);\n  z-index: 0;\n}\n.hero__eyebrow { margin-bottom: 28px; }\n.hero h1 { max-width: 18ch; }\n.hero__lead { margin-top: 28px; max-width: 60ch; color: var(--ink-soft); }\n\n/* ============================================================\n   Utilidades\n   ============================================================ */\n\n.muted { color: var(--ink-soft); }\n.center { text-align: center; }\n.gold { color: var(--gold); }\n.navy { color: var(--navy); }\n\n.divider-gold {\n  width: 36px;\n  height: 1px;\n  background: var(--gold);\n  border: 0;\n  margin: 0;\n}\n\n/* Placeholder genérico de imagen (compartido entre páginas) */\n.img-placeholder {\n  width: 100%;\n  aspect-ratio: 3 / 4;\n  background:\n    linear-gradient(135deg, rgba(11,26,58,0.04) 0%, rgba(193,154,76,0.06) 100%),\n    var(--white);\n  border: 1px solid var(--cream-line);\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  padding: 24px;\n  position: relative;\n}\n.img-placeholder::before {\n  content: \"\";\n  position: absolute;\n  inset: 12px;\n  border: 1px dashed rgba(11,26,58,0.12);\n  pointer-events: none;\n}\n.img-placeholder__eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--gold);\n  position: relative;\n  z-index: 1;\n}\n.img-placeholder__note {\n  font-family: var(--mono);\n  font-size: 10.5px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--grey-soft);\n  position: relative;\n  z-index: 1;\n}\n\n/* Placeholder de página en construcción */\n.stub {\n  min-height: 40vh;\n  display: grid;\n  place-items: center;\n  text-align: center;\n  padding: var(--section-y) var(--gutter);\n}\n.stub .eyebrow { justify-content: center; }\n.stub h2 { margin-top: 24px; max-width: 22ch; }\n.stub p { margin-top: 20px; color: var(--ink-soft); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   CISEC — Páginas legales (Aviso de privacidad, Términos)\n   Tipografía sobria, alta legibilidad. NO usa el lenguaje\n   editorial del resto del sitio.\n   ============================================================ */\n\n.legal {\n  background: var(--cream);\n  padding: clamp(56px, 7vw, 96px) var(--gutter) clamp(96px, 11vw, 144px);\n}\n.legal__wrap {\n  max-width: 760px;\n  margin: 0 auto;\n}\n\n/* -------- Encabezado -------- */\n.legal__head { margin-bottom: 48px; }\n.legal__eyebrow { margin-bottom: 28px; color: var(--gold); }\n.legal__title {\n  font-family: var(--serif);\n  font-weight: 500;\n  font-size: clamp(32px, 4.2vw, 52px);\n  color: var(--navy);\n  line-height: 1.1;\n  letter-spacing: -0.01em;\n  margin: 0 0 16px;\n}\n.legal__updated {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--grey-soft);\n  margin: 0 0 36px;\n}\n.legal__divider {\n  width: 36px;\n  height: 1px;\n  background: var(--gold);\n  border: 0;\n  margin: 0;\n}\n\n/* -------- Documento -------- */\n.legal__doc {\n  font-family: var(--sans);\n  font-size: 16.5px;\n  line-height: 1.7;\n  color: var(--ink);\n}\n\n.legal__section {\n  margin: 0;\n}\n.legal__section + .legal__sep { margin: 0; }\n\n.legal__section h2 {\n  font-family: var(--serif);\n  font-weight: 500;\n  font-size: clamp(22px, 2.4vw, 28px);\n  color: var(--navy);\n  line-height: 1.2;\n  letter-spacing: -0.005em;\n  margin: 0 0 20px;\n}\n\n.legal__section h3 {\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: 16px;\n  color: var(--navy);\n  letter-spacing: 0.005em;\n  margin: 28px 0 14px;\n}\n.legal__h3-note {\n  font-weight: 400;\n  color: var(--ink-soft);\n  font-style: italic;\n}\n\n.legal__section p {\n  margin: 0 0 1.1em;\n  max-width: none;\n}\n.legal__section p:last-child { margin-bottom: 0; }\n\n.legal__section strong {\n  color: var(--navy);\n  font-weight: 600;\n}\n\n/* Listas */\n.legal__list { margin: 0 0 1.1em; gap: 10px; }\n.legal__list li { line-height: 1.6; }\n\n.legal__ol {\n  list-style: none;\n  counter-reset: legal-ol;\n  margin: 0 0 1.1em;\n  padding: 0;\n  display: grid;\n  gap: 12px;\n}\n.legal__ol > li {\n  counter-increment: legal-ol;\n  position: relative;\n  padding-left: 32px;\n  line-height: 1.6;\n}\n.legal__ol > li::before {\n  content: counter(legal-ol, decimal-leading-zero);\n  position: absolute;\n  left: 0;\n  top: 0;\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.05em;\n  color: var(--gold);\n  font-weight: 500;\n  padding-top: 4px;\n}\n\n/* Enlaces */\n.legal__link {\n  color: var(--navy);\n  text-decoration: none;\n  border-bottom: 1px solid var(--cream-line);\n  padding-bottom: 1px;\n  transition: color .15s ease, border-color .15s ease;\n}\n.legal__link:hover {\n  color: var(--gold);\n  border-bottom-color: var(--gold);\n}\n\n/* Separadores entre secciones */\n.legal__sep {\n  height: 1px;\n  border: 0;\n  background: rgba(180, 175, 165, 0.32);\n  margin: 48px 0;\n}\n\n/* -------- Tabla de transferencias -------- */\n.legal__table-wrap {\n  margin: 8px 0 1.4em;\n  border: 1px solid var(--cream-line);\n  background: var(--white);\n  overflow-x: auto;\n  box-shadow: var(--shadow-card);\n  position: relative;\n}\n.legal__table-wrap::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0;\n  width: 56px;\n  height: 3px;\n  background: var(--gold);\n  z-index: 1;\n}\n.legal__table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 14.5px;\n  line-height: 1.55;\n  min-width: 560px;\n}\n.legal__table thead th {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--grey-soft);\n  font-weight: 500;\n  text-align: left;\n  padding: 18px 20px;\n  border-bottom: 1px solid var(--cream-line);\n  background: var(--cream);\n}\n.legal__table tbody th,\n.legal__table tbody td {\n  padding: 18px 20px;\n  vertical-align: top;\n  border-bottom: 1px solid var(--cream-line);\n  font-weight: 400;\n  text-align: left;\n}\n.legal__table tbody tr:last-child th,\n.legal__table tbody tr:last-child td {\n  border-bottom: 0;\n}\n.legal__table tbody th { width: 24%; }\n.legal__table tbody td { color: var(--ink); }\n.legal__table tbody th strong { color: var(--navy); font-weight: 600; }\n\n@media (max-width: 640px) {\n  .legal__table thead th,\n  .legal__table tbody th,\n  .legal__table tbody td { padding: 14px 14px; font-size: 14px; }\n}\n\n/* -------- Bloque de contacto (definition list) -------- */\n.legal__contact {\n  display: grid;\n  gap: 0;\n  margin: 16px 0 0;\n  border-top: 1px solid var(--cream-line);\n  border-bottom: 1px solid var(--cream-line);\n}\n.legal__contact-row {\n  display: grid;\n  grid-template-columns: minmax(180px, 0.6fr) 1.4fr;\n  gap: 24px;\n  padding: 16px 0;\n  border-top: 1px solid var(--cream-line);\n}\n.legal__contact-row:first-child { border-top: 0; }\n@media (max-width: 540px) {\n  .legal__contact-row { grid-template-columns: 1fr; gap: 4px; padding: 14px 0; }\n}\n.legal__contact-row dt {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--grey-soft);\n  padding-top: 4px;\n}\n.legal__contact-row dd {\n  margin: 0;\n  font-size: 16px;\n  color: var(--navy);\n  line-height: 1.5;\n}\n\n/* -------- Pie del documento -------- */\n.legal__footnote {\n  font-style: italic;\n  color: var(--ink-soft);\n  font-size: 14.5px;\n  line-height: 1.7;\n  margin: 0;\n  max-width: none;\n}\n\n/* ============================================================\n   Variante numerada (Términos y condiciones)\n   ============================================================ */\n\n.legal__doc--numbered .legal__section h2 {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n.legal__num {\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 500;\n  color: var(--gold);\n  letter-spacing: -0.01em;\n  font-size: 1em;\n}\n.legal__subnum {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--gold);\n  margin-right: 12px;\n  font-weight: 500;\n  display: inline-block;\n}\n\n/* ============================================================\n   Aviso destacado (sección 5.1 — no reembolsos)\n   ============================================================ */\n\n.legal-notice {\n  background: var(--white);\n  border: 1px solid var(--cream-line);\n  padding: clamp(28px, 3.5vw, 44px);\n  margin: 8px 0 32px;\n  position: relative;\n  box-shadow: 0 1px 2px rgba(11,26,58,0.06), 0 12px 32px -14px rgba(193,154,76,0.20);\n}\n.legal-notice::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 4px;\n  background: var(--gold);\n}\n\n.legal-notice__head {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 16px;\n  margin-bottom: 20px;\n  flex-wrap: wrap;\n}\n.legal-notice__badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--gold);\n}\n.legal-notice__badge svg { width: 14px; height: 14px; }\n.legal-notice__sub {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--grey-soft);\n}\n\n.legal-notice__title {\n  font-family: var(--serif);\n  font-weight: 500;\n  font-size: clamp(22px, 2.6vw, 30px);\n  color: var(--navy);\n  line-height: 1.2;\n  letter-spacing: -0.005em;\n  margin: 0 0 18px;\n  max-width: 28ch;\n}\n.legal-notice__title em {\n  font-style: italic;\n  color: var(--gold);\n  font-weight: 500;\n}\n\n.legal-notice__body {\n  font-size: 16px;\n  line-height: 1.65;\n  color: var(--ink);\n  margin: 0 0 16px;\n}\n.legal-notice__list { gap: 10px; }\n.legal-notice__list li { font-size: 15.5px; line-height: 1.6; }\n<\u002Fstyle>\n\n  \n  \n<\u002Fhead>\n<body data-active=\"\">\n\n  <main class=\"legal\" data-screen-label=\"Aviso de privacidad\">\n    <div class=\"legal__wrap\">\n\n      <header class=\"legal__head\">\n        <div class=\"eyebrow legal__eyebrow\">\n          <span class=\"rule\"><\u002Fspan>\n          <span>Documento legal · CISEC<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"legal__title\">Aviso de Privacidad.<\u002Fh1>\n        <p class=\"legal__updated\">Última actualización: 12 de mayo de 2025<\u002Fp>\n        <hr class=\"legal__divider\">\n      <\u002Fheader>\n\n      <article class=\"legal__doc\">\n\n        <section class=\"legal__section\">\n          <h2>Identidad y domicilio del responsable<\u002Fh2>\n          <p>\n            <strong>MARKET ANIMALES, S. DE R.L. DE C.V.<\u002Fstrong> (en adelante, \"CISEC\"), con Registro Federal de Contribuyentes <strong>MAN2201245L2<\u002Fstrong> y domicilio en <strong>Calle Constitución #26, Col. Centro, C.P. 91500, Coatepec, Veracruz, México<\u002Fstrong>, es la persona moral responsable del tratamiento de sus datos personales conforme a lo dispuesto por la Ley Federal de Protección de Datos Personales en Posesión de los Particulares (LFPDPPP), su Reglamento y demás normativa aplicable.\n          <\u002Fp>\n          <p>\n            CISEC opera bajo la marca <strong>Centro Integral de Saberes, Evaluación y Certificación<\u002Fstrong> y pone a su disposición el presente Aviso de Privacidad con el objeto de informarle sobre el tratamiento que se dará a sus datos personales cuando los mismos sean recabados, utilizados, almacenados o transferidos por CISEC.\n          <\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Datos personales que recabamos<\u002Fh2>\n          <p>Para las finalidades señaladas en el presente Aviso, CISEC podrá recabar los siguientes datos personales:<\u002Fp>\n\n          <h3>Datos de identificación y contacto<\u002Fh3>\n          <ul class=\"legal__list dot-list\">\n            <li>Nombre completo<\u002Fli>\n            <li>Correo electrónico<\u002Fli>\n            <li>Número telefónico<\u002Fli>\n            <li>Domicilio (cuando aplique para inscripción o facturación)<\u002Fli>\n            <li>CURP<\u002Fli>\n            <li>Identificación oficial (INE) vigente<\u002Fli>\n          <\u002Ful>\n\n          <h3>Datos académicos y profesionales<\u002Fh3>\n          <ul class=\"legal__list dot-list\">\n            <li>Grado de estudios<\u002Fli>\n            <li>Área profesional<\u002Fli>\n            <li>Experiencia laboral relevante (cuando aplique al programa)<\u002Fli>\n          <\u002Ful>\n\n          <h3>Datos de facturación (cuando aplique)<\u002Fh3>\n          <ul class=\"legal__list dot-list\">\n            <li>RFC<\u002Fli>\n            <li>Razón social<\u002Fli>\n            <li>Régimen fiscal<\u002Fli>\n            <li>Domicilio fiscal<\u002Fli>\n            <li>Uso de CFDI<\u002Fli>\n          <\u002Ful>\n\n          <p><strong>CISEC NO recaba datos personales sensibles<\u002Fstrong> en los términos definidos por la LFPDPPP (datos de origen racial o étnico, estado de salud presente o futuro, información genética, creencias religiosas, filosóficas y morales, afiliación sindical, opiniones políticas o preferencia sexual).<\u002Fp>\n\n          <p><strong>CISEC NO recaba datos personales de menores de edad.<\u002Fstrong> Los programas académicos que imparte y respalda están dirigidos exclusivamente a personas mayores de 18 años.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Finalidades del tratamiento<\u002Fh2>\n          <p>Sus datos personales serán utilizados para las siguientes finalidades:<\u002Fp>\n\n          <h3>Finalidades primarias <span class=\"legal__h3-note\">— necesarias para la prestación del servicio<\u002Fspan><\u002Fh3>\n          <ol class=\"legal__ol\">\n            <li>Atender consultas académicas, administrativas y de inscripción recibidas por los canales de contacto institucionales (teléfono, correo electrónico y formulario web).<\u002Fli>\n            <li>Gestionar el proceso de inscripción a programas académicos impartidos o respaldados por CISEC.<\u002Fli>\n            <li>Integrar el expediente académico del alumno.<\u002Fli>\n            <li>Emitir constancias, diplomas y documentos académicos correspondientes a los programas concluidos.<\u002Fli>\n            <li>Procesar pagos derivados de la inscripción a programas académicos.<\u002Fli>\n            <li>Emitir comprobantes fiscales digitales (CFDI) cuando el usuario así lo solicite.<\u002Fli>\n            <li>Cumplir con las obligaciones fiscales, contables y legales aplicables.<\u002Fli>\n            <li>Mantener comunicación con el alumno durante el desarrollo del programa académico.<\u002Fli>\n            <li>Conservar el registro institucional del programa académico para fines de verificación pública mediante folio único.<\u002Fli>\n          <\u002Fol>\n\n          <h3>Finalidades secundarias <span class=\"legal__h3-note\">— no necesarias para la prestación del servicio<\u002Fspan><\u002Fh3>\n          <ul class=\"legal__list dot-list\">\n            <li>Informar sobre nuevos programas académicos, eventos y actividades de CISEC mediante los datos de contacto proporcionados.<\u002Fli>\n          <\u002Ful>\n\n          <p><strong>Si usted no desea que sus datos personales sean tratados para las finalidades secundarias<\u002Fstrong>, puede manifestarlo enviando un correo electrónico a <a class=\"legal__link\" href=\"mailto:atencion@cisecce.com\">atencion@cisecce.com<\u002Fa> indicando expresamente su negativa. La negativa al uso de sus datos personales para finalidades secundarias no será motivo para que CISEC le niegue los servicios académicos solicitados.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Transferencias de datos personales<\u002Fh2>\n          <p>CISEC podrá transferir sus datos personales, sin requerir su consentimiento expreso, a las siguientes personas y para las siguientes finalidades:<\u002Fp>\n\n          <div class=\"legal__table-wrap\">\n            <table class=\"legal__table\">\n              <thead>\n                <tr>\n                  <th scope=\"col\">Tercero<\u002Fth>\n                  <th scope=\"col\">Finalidad de la transferencia<\u002Fth>\n                  <th scope=\"col\">Fundamento legal<\u002Fth>\n                <\u002Ftr>\n              <\u002Fthead>\n              <tbody>\n                <tr>\n                  <th scope=\"row\"><strong>BIOS Academy<\u002Fstrong><\u002Fth>\n                  <td>Coemisión de programas académicos cuando ambas instituciones operen conjuntamente un programa (como en el caso del Diplomado Integral en Gestión de Tramitología de UMAs y PIMVS).<\u002Ftd>\n                  <td>Necesaria para la prestación conjunta del servicio académico.<\u002Ftd>\n                <\u002Ftr>\n                <tr>\n                  <th scope=\"row\"><strong>FormSubmit<\u002Fstrong><\u002Fth>\n                  <td>Procesamiento del formulario de contacto del sitio web cisecce.com para el envío de mensajes al correo institucional de CISEC.<\u002Ftd>\n                  <td>Necesaria para la operación del canal de contacto.<\u002Ftd>\n                <\u002Ftr>\n                <tr>\n                  <th scope=\"row\"><strong>YCloud / WhatsApp Business<\u002Fstrong><\u002Fth>\n                  <td>Cuando aplique para la comunicación operativa de inscripción y seguimiento del programa académico.<\u002Ftd>\n                  <td>Necesaria para la prestación del servicio académico.<\u002Ftd>\n                <\u002Ftr>\n                <tr>\n                  <th scope=\"row\"><strong>Mercado Pago<\u002Fstrong><\u002Fth>\n                  <td>Procesamiento de pagos por concepto de inscripción a programas académicos.<\u002Ftd>\n                  <td>Necesaria para la prestación del servicio.<\u002Ftd>\n                <\u002Ftr>\n                <tr>\n                  <th scope=\"row\"><strong>Servicio de Administración Tributaria (SAT)<\u002Fstrong><\u002Fth>\n                  <td>Cumplimiento de obligaciones fiscales (emisión de CFDI, declaraciones, conservación de comprobantes).<\u002Ftd>\n                  <td>Obligación legal en términos del Código Fiscal de la Federación.<\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody>\n            <\u002Ftable>\n          <\u002Fdiv>\n\n          <p>Cualquier transferencia adicional o diferente a las arriba listadas requerirá su consentimiento expreso previo.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Plazo de conservación de los datos<\u002Fh2>\n          <p>CISEC conservará sus datos personales únicamente por el tiempo necesario para cumplir con las finalidades para las que fueron recabados, conforme a los siguientes plazos:<\u002Fp>\n\n          <p><strong>Datos de personas que contactaron a CISEC pero no formalizaron inscripción:<\u002Fstrong> Los datos se conservarán por un periodo máximo de <strong>12 meses<\u002Fstrong> contados a partir del último contacto, transcurrido el cual serán eliminados de las bases de datos institucionales.<\u002Fp>\n\n          <p><strong>Datos de alumnos que formalizaron inscripción:<\u002Fstrong> Los datos se conservarán por un periodo mínimo de <strong>5 años<\u002Fstrong> contados a partir de la conclusión del programa académico, en cumplimiento de las obligaciones fiscales aplicables.<\u002Fp>\n\n          <p><strong>Datos académicos asociados a constancias emitidas<\u002Fstrong> (folio institucional, nombre del programa, fechas, duración, modalidad): Estos datos se conservarán <strong>de manera indefinida<\u002Fstrong> mientras CISEC continúe operando, con la finalidad de permitir la verificación pública del programa académico mediante el folio único asignado, así como la reposición de constancias a solicitud del titular.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Derechos ARCO y mecanismos para ejercerlos<\u002Fh2>\n          <p>Usted, como titular de los datos personales, tiene en todo momento el derecho a:<\u002Fp>\n\n          <ul class=\"legal__list dot-list\">\n            <li><strong>Acceder<\u002Fstrong> a sus datos personales que CISEC posee, así como conocer los detalles del tratamiento de los mismos.<\u002Fli>\n            <li><strong>Rectificar<\u002Fstrong> sus datos personales en caso de que estén desactualizados, sean inexactos o incompletos.<\u002Fli>\n            <li><strong>Cancelar<\u002Fstrong> sus datos personales cuando considere que no están siendo utilizados conforme a los principios y obligaciones aplicables.<\u002Fli>\n            <li><strong>Oponerse<\u002Fstrong> al uso de sus datos personales para fines específicos.<\u002Fli>\n          <\u002Ful>\n\n          <p>Para ejercer cualquiera de los derechos ARCO, así como para revocar el consentimiento que haya otorgado, puede dirigir una solicitud por escrito al correo electrónico <a class=\"legal__link\" href=\"mailto:atencion@cisecce.com\">atencion@cisecce.com<\u002Fa>, indicando:<\u002Fp>\n\n          <ol class=\"legal__ol\">\n            <li>Nombre completo del titular.<\u002Fli>\n            <li>Domicilio o correo electrónico para recibir la respuesta.<\u002Fli>\n            <li>Documentos que acrediten la identidad del titular (copia digital de INE o documento equivalente).<\u002Fli>\n            <li>Descripción clara y precisa de los datos personales respecto de los cuales se busca ejercer alguno de los derechos.<\u002Fli>\n            <li>Cualquier otro elemento que facilite la localización de los datos personales.<\u002Fli>\n          <\u002Fol>\n\n          <p>CISEC dará respuesta a su solicitud en un plazo máximo de <strong>20 días hábiles<\u002Fstrong> contados a partir de la recepción de la misma, y comunicará la determinación adoptada al correo electrónico o domicilio proporcionado.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Revocación del consentimiento<\u002Fh2>\n          <p>En cualquier momento usted podrá revocar el consentimiento otorgado a CISEC para el tratamiento de sus datos personales, mediante solicitud por escrito enviada al correo electrónico <a class=\"legal__link\" href=\"mailto:atencion@cisecce.com\">atencion@cisecce.com<\u002Fa>.<\u002Fp>\n          <p>Es importante tener en cuenta que en algunos casos la revocación del consentimiento no procederá, ya sea por exigencia legal o porque sea necesario el tratamiento de los datos para concluir la prestación del servicio académico contratado.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Uso de cookies y tecnologías similares<\u002Fh2>\n          <p>El sitio web <strong>cisecce.com NO utiliza cookies de seguimiento, herramientas de analítica web ni tecnologías similares<\u002Fstrong> para recopilar información sobre el comportamiento de los visitantes. CISEC tampoco utiliza píxeles publicitarios ni herramientas de remarketing de terceros (como Google Analytics, Meta Pixel u otros).<\u002Fp>\n          <p>La única información que el sitio recopila es la que usted proporciona voluntariamente mediante el formulario de contacto.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Propiedad intelectual y materiales académicos<\u002Fh2>\n          <p>Todo material académico entregado a los alumnos durante el desarrollo de los programas (apuntes, presentaciones, videos, grabaciones de clases, bibliografía digital, plantillas, ejercicios, casos prácticos y cualquier otro recurso) es <strong>propiedad intelectual exclusiva de CISEC y, cuando aplique, de las instituciones coemisoras del programa<\u002Fstrong>.<\u002Fp>\n          <p>Estos materiales son <strong>de uso personal y exclusivo del alumno inscrito<\u002Fstrong>. Queda estrictamente prohibida su reproducción total o parcial, distribución, comunicación pública, modificación, comercialización o cualquier otro uso no autorizado expresamente por escrito por CISEC.<\u002Fp>\n          <p>El acceso y uso de estos materiales no transfiere al alumno ningún derecho de propiedad intelectual sobre los mismos, salvo el uso personal y privado para fines de estudio durante y después del programa académico.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Modificaciones al Aviso de Privacidad<\u002Fh2>\n          <p>CISEC se reserva el derecho de efectuar en cualquier momento modificaciones o actualizaciones al presente Aviso de Privacidad, derivado de nuevos requerimientos legales, de las propias necesidades de los productos o servicios ofrecidos, de prácticas en materia de privacidad, de cambios en el modelo de negocio o por otras causas.<\u002Fp>\n          <p>Cualquier modificación al presente Aviso de Privacidad será publicada en el sitio web <strong>cisecce.com<\u002Fstrong>, indicando la fecha de última actualización. Es responsabilidad del titular consultar periódicamente el sitio para conocer cualquier cambio.<\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Autoridad competente<\u002Fh2>\n          <p>Si considera que su derecho a la protección de datos personales ha sido vulnerado por alguna conducta u omisión de CISEC, o presume alguna violación a las disposiciones previstas en la LFPDPPP, su Reglamento y demás ordenamientos aplicables, podrá interponer su queja o denuncia ante el <strong>Instituto Nacional de Transparencia, Acceso a la Información y Protección de Datos Personales (INAI)<\u002Fstrong>.<\u002Fp>\n          <p>Para mayor información, puede visitar el sitio web del INAI: <a class=\"legal__link\" href=\"https://www.inai.org.mx\" target=\"_blank\" rel=\"noopener noreferrer\">www.inai.org.mx<\u002Fa><\u002Fp>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <section class=\"legal__section\">\n          <h2>Contacto<\u002Fh2>\n          <p>Para cualquier duda, aclaración o solicitud relacionada con el presente Aviso de Privacidad o el tratamiento de sus datos personales:<\u002Fp>\n\n          <dl class=\"legal__contact\">\n            <div class=\"legal__contact-row\">\n              <dt>Correo electrónico<\u002Fdt>\n              <dd><a class=\"legal__link\" href=\"mailto:atencion@cisecce.com\"><strong>atencion@cisecce.com<\u002Fstrong><\u002Fa><\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"legal__contact-row\">\n              <dt>Teléfono<\u002Fdt>\n              <dd><strong>+52 228 108 0898<\u002Fstrong><\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"legal__contact-row\">\n              <dt>Domicilio<\u002Fdt>\n              <dd><strong>Calle Constitución #26, Col. Centro, C.P. 91500, Coatepec, Veracruz, México<\u002Fstrong><\u002Fdd>\n            <\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fsection>\n\n        <hr class=\"legal__sep\">\n\n        <p class=\"legal__footnote\">\n          Este Aviso de Privacidad cumple con lo establecido por la Ley Federal de Protección de Datos Personales en Posesión de los Particulares y su Reglamento. CISEC se compromete a tratar sus datos personales bajo los principios de licitud, consentimiento, información, calidad, finalidad, lealtad, proporcionalidad y responsabilidad.\n        <\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <script>\n/* ============================================================\n   CISEC — Header & Footer compartidos\n   Renderizan según data-active del <body>\n   ============================================================ */\n\n(function () {\n  const NAV = [\n    { id: \"nosotros\",  label: \"Nosotros\",          href: \"nosotros.html\" },\n    { id: \"areas\",     label: \"Áreas\",             href: \"areas.html\" },\n    { id: \"eventos\",   label: \"Eventos académicos\", href: \"eventos.html\" },\n    { id: \"sede\",      label: \"Sede\",              href: \"sede.html\" },\n    { id: \"contacto\",  label: \"Contacto\",          href: \"contacto.html\" },\n  ];\n\n  const active = document.body.dataset.active || \"\";\n  const BASE
